name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile notebook.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5
          python -m pip install flet-android-notifications==0.10.0
          python -m pip install certifi

      - name: Clean old Flet build files
        run: |
          flet clean

      - name: Generate Flutter project
        run: |
          flet build apk \
            --module-name notebook.py \
            --yes \
            --verbose \
            || true

      - name: Check Flutter project was generated
        run: |
          test -d build/flutter
          test -f build/flutter/android/app/src/main/AndroidManifest.xml
          echo "✅ Flutter project generated successfully."

      - name: Patch Android notifications
        run: |
          flet-android-notifications-patch \
            --project-root build/flutter

      - name: Verify notification patch
        run: |
          MANIFEST="build/flutter/android/app/src/main/AndroidManifest.xml"

          echo "===== CHECKING NOTIFICATION RECEIVERS ====="

          test -f "$MANIFEST"

          grep -q \
            "com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" \
            "$MANIFEST"

          grep -q \
            "com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" \
            "$MANIFEST"

          grep -q \
            "com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver" \
            "$MANIFEST"

          echo "✅ Scheduled notification receivers are present."

          echo "===== CHECKING DESUGARING ====="

          grep -Rqi \
            "coreLibraryDesugaring" \
            build/flutter/android/app \
            || {
              echo "❌ Core library desugaring was NOT added."
              exit 1
            }

          echo "✅ Core library desugaring configuration found."

      - name: Build final APK
        run: |
          flet build apk \
            --module-name notebook.py \
            --yes \
            --verbose

      - name: Check APK
        run: |
          echo "===== APK FILES ====="

          find build/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find build/apk -type f -name '*.apk' -print -quit)"

          echo "✅ APK successfully created."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notebook-apk
          path: build/apk/*.apk
