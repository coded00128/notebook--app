name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile notebook.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5 flet-android-notifications==0.10.0

      - name: Build APK
        run: |
          flet build apk \
            --module-name notebook.py \
            --yes \
            --verbose

      - name: Show Gradle logs if build fails
        if: failure()
        run: |
          echo "===== GRADLE ERROR LOGS ====="
          find build/flutter -type f \( -name "*.log" -o -name "*.txt" \) -print -exec tail -n 200 {} \; 2>/dev/null || true

          echo "===== GRADLE DIRECTORY ====="
          find build/flutter/android -maxdepth 3 -type f 2>/dev/null | head -100 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-apk
          path: build/apk/*.apk
