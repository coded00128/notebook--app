name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile notebook.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5
          python -m pip install flet-android-notifications==0.10.0
          python -m pip install certifi

      - name: Generate Flutter Android project
        run: |
          flet build apk \
            --module-name notebook.py \
            --yes \
            --verbose \
            || true

      - name: Patch Android notifications
        run: |
          flet-android-notifications-patch \
            --project-root build/flutter

      - name: Build patched Android APK
        run: |
          export PATH="/home/runner/flutter/3.44.8/bin:$PATH"
          cd build/flutter

          flutter pub get

          flutter build apk \
            --release \
            --target-platform android-arm64,android-x64,android-arm

      - name: Show build files if build fails
        if: failure()
        run: |
          echo "===== FLUTTER DIRECTORY ====="
          find build/flutter -maxdepth 3 -type f \
            2>/dev/null | head -200 || true

          echo "===== GRADLE LOGS ====="
          find build/flutter -type f \( -name "*.log" -o -name "*.txt" \) \
            -print -exec tail -n 200 {} \; 2>/dev/null || true

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find build/flutter/build/app/outputs/apk \
            -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-apk
          path: |
            build/flutter/build/app/outputs/apk/release/*.apk
