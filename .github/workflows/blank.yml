name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

            - name: Build APK
              run: |
          flet build apk notebook.py --yes --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notebook-apk
          path: build/apk/*.apk

