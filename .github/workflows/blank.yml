name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile notebook.py

      - name: Install Flet and notifications
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5 flet-android-notifications

      - name: Generate Android project
        run: |
          flet build apk --module-name notebook.py --yes --verbose || true

      - name: Patch Android notifications
        run: |
          flet-android-notifications-patch --project-root build/flutter

      - name: Build APK
        run: |
          flet build apk --module-name notebook.py --yes --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notebook-apk
          path: build/apk/*.apk
