name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile notebook.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5 flet-android-notifications

      - name: Generate Android project
        run: |
          flet build apk \
            --module-name notebook.py \
            --yes \
            --verbose

      - name: Enable Android core library desugaring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("build/flutter/android/app/build.gradle")
          text = path.read_text()

          if "coreLibraryDesugaringEnabled true" not in text:
              text = text.replace(
                  "android {",
                  "android {\n"
                  "    compileOptions {\n"
                  "        coreLibraryDesugaringEnabled true\n"
                  "        sourceCompatibility JavaVersion.VERSION_17\n"
                  "        targetCompatibility JavaVersion.VERSION_17\n"
                  "    }\n",
                  1
              )

          if "coreLibraryDesugaring" not in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {\n"
                  "    coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.5'\n",
                  1
              )

          path.write_text(text)
          PY

      - name: Build final APK
        run: |
          cd build/flutter
          flutter build apk \
            --target-platform android-arm64,android-x64,android-arm \
            --build-number 2 \
            --build-name 1.0.0 \
            --no-version-check \
            --suppress-analytics

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notebook-apk
          path: build/flutter/build/app/outputs/flutter-apk/*.apk
