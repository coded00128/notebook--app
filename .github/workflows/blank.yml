name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile notebook.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.5
          python -m pip install flet-android-notifications==0.10.0
          python -m pip install certifi

      - name: Generate Flutter project
        run: |
          flet build apk \
            --module-name notebook.py \
            --yes \
            --verbose

      - name: Patch Android notifications
        run: |
          flet-android-notifications-patch \
            --project-root build/flutter

      - name: Verify notification receiver was patched
        run: |
          MANIFEST="build/flutter/android/app/src/main/AndroidManifest.xml"

          echo "===== CHECKING NOTIFICATION RECEIVER ====="

          test -f "$MANIFEST"

          grep -q \
            "com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" \
            "$MANIFEST"

          grep -q \
            "com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" \
            "$MANIFEST"

          echo "✅ Scheduled notification receivers are present."

      - name: Build APK
        run: |
          export PATH="/home/runner/flutter/3.44.8/bin:$PATH"

          export SERIOUS_PYTHON_SITE_PACKAGES="$GITHUB_WORKSPACE/build/site-packages"
          export SERIOUS_PYTHON_APP="$GITHUB_WORKSPACE/build/flutter"

          cd build/flutter

          flutter pub get

          flutter build apk \
            --release \
            --target-platform android-arm64,android-x64,android-arm

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="

          find build/flutter/build/app/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-apk
          path: |
            build/flutter/build/app/outputs/apk/release/*.apk
